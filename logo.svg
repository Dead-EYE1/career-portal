<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="100%" height="100%">
    <defs>
        <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0b3166" />
            <stop offset="100%" stop-color="#1b78c4" />
        </linearGradient>
        <linearGradient id="orangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ed6712" />
            <stop offset="100%" stop-color="#f5a433" />
        </linearGradient>
        
        <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="3" dy="7" stdDeviation="5" flood-color="#051530" flood-opacity="0.25"/>
        </filter>
        <filter id="lightShadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#051530" flood-opacity="0.15"/>
        </filter>
    </defs>

    <!-- Bell and Notification Signals -->
    <g transform="translate(260, 100)" filter="url(#shadow)">
        <!-- Top loop -->
        <path d="M -6,-16 C -6,-24 6,-24 6,-16" fill="none" stroke="url(#blueGrad)" stroke-width="5" stroke-linecap="round"/>
        <!-- Bell Body -->
        <path d="M -22,12 C -22,-5 22,-5 22,12 C 28,24 32,24 32,30 L -32,30 C -32,24 -28,24 -22,12 Z" fill="url(#blueGrad)" />
        <!-- Bell Clapper -->
        <circle cx="0" cy="35" r="7" fill="url(#blueGrad)" />
        
        <!-- Signal Arcs -->
        <g stroke-linecap="round" fill="none">
            <path d="M -15,-25 A 25 25 0 0 1 15,-25" stroke="url(#orangeGrad)" stroke-width="5" />
            <path d="M -25,-35 A 40 40 0 0 1 25,-35" stroke="url(#blueGrad)" stroke-width="6" />
            <path d="M -35,-45 A 55 55 0 0 1 35,-45" stroke="url(#orangeGrad)" stroke-width="7" />
        </g>
    </g>

    <!-- The 'N' Logo -->
    <g>
        <!-- Diagonal (Orange) - Behind -->
        <path d="M 220,220 Q 240,320 300,380" fill="none" stroke="url(#orangeGrad)" stroke-width="55" stroke-linecap="round" filter="url(#lightShadow)" />
        
        <!-- Left Leg (Blue) - Front Top -->
        <path d="M 100,400 Q 140,250 220,220" fill="none" stroke="url(#blueGrad)" stroke-width="55" stroke-linecap="round" filter="url(#shadow)" />
        
        <!-- Right Leg & Arrow (Blue) - Front Bottom -->
        <g filter="url(#shadow)">
            <circle cx="300" cy="380" r="27.5" fill="url(#blueGrad)" />
            <!-- Sweeping curved stem -->
            <path d="M 300,380 Q 310,250 390,150" fill="none" stroke="url(#blueGrad)" stroke-width="55" stroke-linecap="butt" />
            <!-- Flame/Leaf style curved arrowhead -->
            <g transform="translate(390, 150) rotate(-51.34)">
                <path d="M 80,0 C 40,-10 10,-40 -20,-50 C -5,-20 -5,20 -20,50 C 10,40 40,10 80,0 Z" fill="url(#blueGrad)" />
            </g>
        </g>
    </g>
</svg>
