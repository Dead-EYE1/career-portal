<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="100%" height="100%">
    <defs>
        <!-- Smooth Elegant 3D Gradients (Restoring Original Colors) -->
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c8bea" />
            <stop offset="40%" stop-color="#1b78c4" />
            <stop offset="100%" stop-color="#0b3166" />
        </linearGradient>

        <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb94f" />
            <stop offset="40%" stop-color="#f5a433" />
            <stop offset="100%" stop-color="#ed6712" />
        </linearGradient>
        
        <!-- Premium 3D Bevel and Drop Shadow Filter -->
        <filter id="premium3D" x="-30%" y="-30%" width="160%" height="160%">
            <!-- Drop Shadows -->
            <feDropShadow dx="5" dy="10" stdDeviation="6" flood-color="#030b1c" flood-opacity="0.4" result="shadow1"/>
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#01060d" flood-opacity="0.6" result="shadow2" in="SourceGraphic"/>
            
            <feMerge result="allShadows">
                <feMergeNode in="shadow1"/>
                <feMergeNode in="shadow2"/>
            </feMerge>

            <!-- Bevel Rim Light (Top-Left) -->
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blurLight"/>
            <feOffset in="blurLight" dx="2.5" dy="2.5" result="offsetLight"/>
            <feComposite operator="out" in="SourceAlpha" in2="offsetLight" result="highlightMask"/>
            <feFlood flood-color="#ffffff" flood-opacity="0.8" result="highlightColor"/>
            <feComposite operator="in" in="highlightColor" in2="highlightMask" result="highlight"/>

            <!-- Bevel Inner Shadow (Bottom-Right) -->
            <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blurShadow"/>
            <feOffset in="blurShadow" dx="-3.5" dy="-3.5" result="offsetShadow"/>
            <feComposite operator="out" in="SourceAlpha" in2="offsetShadow" result="shadowMask"/>
            <feFlood flood-color="#000000" flood-opacity="0.7" result="shadowColor"/>
            <feComposite operator="in" in="shadowColor" in2="shadowMask" result="innerShadow"/>

            <!-- Final 3D Composition -->
            <feMerge>
                <feMergeNode in="allShadows"/>
                <feMergeNode in="SourceGraphic"/>
                <feMergeNode in="innerShadow"/>
                <feMergeNode in="highlight"/>
            </feMerge>
        </filter>
        
        <!-- Softer 3D filter for the background diagonal to create depth -->
        <filter id="premium3D_subtle" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#030b1c" flood-opacity="0.3" result="shadow1"/>
            
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blurLight"/>
            <feOffset in="blurLight" dx="2" dy="2" result="offsetLight"/>
            <feComposite operator="out" in="SourceAlpha" in2="offsetLight" result="highlightMask"/>
            <feFlood flood-color="#ffffff" flood-opacity="0.6" result="highlightColor"/>
            <feComposite operator="in" in="highlightColor" in2="highlightMask" result="highlight"/>

            <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blurShadow"/>
            <feOffset in="blurShadow" dx="-3" dy="-3" result="offsetShadow"/>
            <feComposite operator="out" in="SourceAlpha" in2="offsetShadow" result="shadowMask"/>
            <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
            <feComposite operator="in" in="shadowColor" in2="shadowMask" result="innerShadow"/>

            <feMerge>
                <feMergeNode in="shadow1"/>
                <feMergeNode in="SourceGraphic"/>
                <feMergeNode in="innerShadow"/>
                <feMergeNode in="highlight"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Academic Emblem (Graduation Cap) -->
    <g transform="translate(260, 95)" filter="url(#premium3D_subtle)">
        <!-- Cap Base (Skullcap) -->
        <path d="M -35,10 L -35,32 Q 0,55 35,32 L 35,10 Z" fill="url(#blueGrad)" />
        
        <!-- Mortarboard (Top Diamond) -->
        <polygon points="-65,0 0,-20 65,0 0,20" fill="url(#blueGrad)" />
        
        <!-- Tassel String -->
        <path d="M 0,0 Q 40,5 50,28" fill="none" stroke="url(#orangeGrad)" stroke-width="3.5" stroke-linecap="round" />
        
        <!-- Tassel Fringe (Brush) -->
        <path d="M 50,28 L 57,48 Q 50,53 43,48 Z" fill="url(#orangeGrad)" />
        
        <!-- Tassel Button -->
        <circle cx="0" cy="0" r="4.5" fill="url(#orangeGrad)" />
    </g>

    <!-- The 'N' Logo -->
    <g>
        <!-- Diagonal (Orange) - Behind -->
        <path d="M 190,170 Q 210,320 300,380" fill="none" stroke="url(#orangeGrad)" stroke-width="55" stroke-linecap="round" filter="url(#premium3D_subtle)" />
        
        <!-- Left Leg (Blue) - Front Top -->
        <path d="M 100,400 Q 110,250 190,170" fill="none" stroke="url(#blueGrad)" stroke-width="55" stroke-linecap="round" filter="url(#premium3D)" />
        
        <!-- Right Leg & Arrow (Blue) - Front Bottom -->
        <g filter="url(#premium3D)">
            <circle cx="300" cy="380" r="27.5" fill="url(#blueGrad)" />
            <path d="M 300,380 Q 310,230 390,150" fill="none" stroke="url(#blueGrad)" stroke-width="55" stroke-linecap="butt" />
            <g transform="translate(390, 150) rotate(-45)">
                <path d="M 80,0 C 40,-10 10,-40 -20,-50 C -5,-20 -5,20 -20,50 C 10,40 40,10 80,0 Z" fill="url(#blueGrad)" />
            </g>
        </g>
    </g>
</svg>
