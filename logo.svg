<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="100%" height="100%">
    <defs>
        <!-- Gradients -->
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c8bea" />
            <stop offset="40%" stop-color="#1b78c4" />
            <stop offset="100%" stop-color="#0b3166" />
        </linearGradient>

        <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb94f" />
            <stop offset="40%" stop-color="#f5a433" />
            <stop offset="100%" stop-color="#ed6712" />
        </linearGradient>
        
        <filter id="premium3D_subtle" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#030b1c" flood-opacity="0.3" result="shadow1"/>
            
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blurLight"/>
            <feOffset in="blurLight" dx="2" dy="2" result="offsetLight"/>
            <feComposite operator="out" in="SourceAlpha" in2="offsetLight" result="highlightMask"/>
            <feFlood flood-color="#ffffff" flood-opacity="0.6" result="highlightColor"/>
            <feComposite operator="in" in="highlightColor" in2="highlightMask" result="highlight"/>

            <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blurShadow"/>
            <feOffset in="blurShadow" dx="-3" dy="-3" result="offsetShadow"/>
            <feComposite operator="out" in="SourceAlpha" in2="offsetShadow" result="shadowMask"/>
            <feFlood flood-color="#000000" flood-opacity="0.5" result="shadowColor"/>
            <feComposite operator="in" in="shadowColor" in2="shadowMask" result="innerShadow"/>

            <feMerge>
                <feMergeNode in="shadow1"/>
                <feMergeNode in="SourceGraphic"/>
                <feMergeNode in="innerShadow"/>
                <feMergeNode in="highlight"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Academic Emblem (Graduation Cap) -->
    <g transform="translate(260, 160)" filter="url(#premium3D_subtle)">
        <!-- Cap Base (Skullcap) -->
        <path d="M -50,15 L -50,48 Q 0,80 50,48 L 50,15 Z" fill="url(#blueGrad)" />
        
        <!-- Mortarboard (Top Diamond) -->
        <polygon points="-120,0 0,-40 120,0 0,40" fill="url(#blueGrad)" />
        
        <!-- Tassel String -->
        <path d="M 0,0 Q 60,10 75,50" fill="none" stroke="url(#orangeGrad)" stroke-width="5" stroke-linecap="round" />
        
        <!-- Tassel Fringe (Brush) -->
        <path d="M 75,50 L 90,80 Q 75,90 60,80 Z" fill="url(#orangeGrad)" />
        
        <!-- Tassel Button -->
        <circle cx="0" cy="0" r="7" fill="url(#orangeGrad)" />
    </g>

    <!-- Open Book -->
    <g transform="translate(260, 300) scale(1.3)" filter="url(#premium3D_subtle)">
        <defs>
            <path id="leftPath1" d="M -100,5 Q -60,-20 -20,20" />
            <path id="leftPath2" d="M -100,26 Q -60,0 -20,41" />
            <path id="rightPath1" d="M 20,20 Q 60,-20 100,5" />
            <path id="rightPath2" d="M 20,41 Q 60,0 100,26" />
        </defs>

        <!-- Left Page -->
        <path d="M -120,-30 Q -60,-60 0,-10 L 0,80 Q -60,30 -120,60 Z" fill="url(#orangeGrad)" />
        <path d="M -110,-20 Q -60,-45 -10,0 L -10,70 Q -60,25 -110,50 Z" fill="#ffffff" />
        
        <!-- Left Page Text -->
        <text font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#ed6712" text-anchor="middle">
            <textPath href="#leftPath1" startOffset="50%">NJU</textPath>
        </text>
        <text font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#ed6712" text-anchor="middle">
            <textPath href="#leftPath2" startOffset="50%">Tests</textPath>
        </text>

        <!-- Right Page -->
        <path d="M 120,-30 Q 60,-60 0,-10 L 0,80 Q 60,30 120,60 Z" fill="url(#blueGrad)" />
        <path d="M 110,-20 Q 60,-45 10,0 L 10,70 Q 60,25 110,50 Z" fill="#ffffff" />

        <!-- Right Page Text -->
        <text font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#1b78c4" text-anchor="middle">
            <textPath href="#rightPath1" startOffset="50%">NewJobUpdates</textPath>
        </text>
        <text font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#1b78c4" text-anchor="middle">
            <textPath href="#rightPath2" startOffset="50%">&amp; Tests</textPath>
        </text>
    </g>
</svg>
