<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 80 430 260" width="100%" height="100%">
    <defs>
        <!-- Gradients -->
        <linearGradient id="warmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#e55d09" />
            <stop offset="100%" stop-color="#f2a640" />
        </linearGradient>
        <linearGradient id="coolGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0b2e61" />
            <stop offset="100%" stop-color="#1c68a6" />
        </linearGradient>
        <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#e55d09" />
            <stop offset="50%" stop-color="#f2a640" />
            <stop offset="100%" stop-color="#1c68a6" />
        </linearGradient>
        
        <!-- Drop Shadow for 3D Carved effect -->
        <filter id="carvedShadow" x="-20%" y="-20%" width="150%" height="150%">
            <!-- Deep drop shadow -->
            <feDropShadow dx="6" dy="8" stdDeviation="5" flood-color="#051a3b" flood-opacity="0.4" result="shadow1"/>
            <!-- Tighter darker shadow -->
            <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#051a3b" flood-opacity="0.6" result="shadow2"/>
            <!-- Merge shadows with original graphic -->
            <feMerge>
                <feMergeNode in="shadow1"/>
                <feMergeNode in="shadow2"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- Filter for Tests text -->
        <filter id="testsShadow" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#051a3b" flood-opacity="0.4"/>
            <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#051a3b" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- N and J -->
    <g transform="translate(210, 310)" filter="url(#carvedShadow)">
        <text x="0" y="0" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="180" fill="url(#warmGrad)" letter-spacing="-12">NJ</text>
    </g>
    
    <!-- U -->
    <g transform="translate(460, 310)" filter="url(#carvedShadow)">
        <text x="0" y="0" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="180" fill="url(#coolGrad)">U</text>
    </g>

    <!-- Academic Emblem (Graduation Cap) -->
    <g transform="translate(345, 87) scale(1.5)" filter="url(#carvedShadow)">
        <!-- Mortarboard Top -->
        <path d="M 40,15 L 75,30 L 40,45 L 5,30 Z" fill="url(#coolGrad)"/>
        <!-- Cap Base -->
        <path d="M 20,36 L 20,45 Q 40,65 60,45 L 60,36 Q 40,55 20,36 Z" fill="url(#coolGrad)"/>
        <!-- Tassel String -->
        <path d="M 40,30 Q 65,35 65,45 L 65,53" fill="none" stroke="url(#coolGrad)" stroke-width="3"/>
        <!-- Tassel Fringe -->
        <path d="M 61,53 L 69,53 L 67,62 L 63,62 Z" fill="url(#coolGrad)"/>
        <!-- Top Button -->
        <circle cx="40" cy="30" r="3" fill="#0b2e61"/>
    </g>

    <!-- Swooping Arrow -->
    <g transform="translate(210, 260)" filter="url(#carvedShadow)">
        <path d="M -5,45 
                 Q 150,-60 310,-100 
                 L 295,-130 
                 L 360,-120 
                 L 335,-55 
                 L 318,-80 
                 Q 160,-30 -5,45 Z" fill="url(#arrowGrad)"/>
    </g>

</svg>
